[package]
name = "binlex-python"
version.workspace = true
edition = "2021"

[dependencies]
pyo3 = { version = "0.28.0", features = ["extension-module"] }
memmap2 = "0.9.5"
rayon = "1.10.0"
serde_json = "1.0.145"
postcard = { version = "1.1.3", features = ["alloc"] }
lz4 = "1.28.1"

[lib]
name = "binlex"
crate-type = ["cdylib"]

[dependencies.binlex]
path = "../../"
